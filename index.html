    <link rel="canonical" href="https://before-i-call.onrender.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Before I Call" />
    <meta property="og:url" content="https://before-i-call.onrender.com/" />
    <meta property="og:title" content="Before I Call · Practise the phone call before the real one" />

    <meta property="og:image" content="https://before-i-call.onrender.com/social/og-image.jpg" />

    <meta property="og:image:width" content="1200" />

    <script>
      // Apply a saved light/dark choice before first paint; App.tsx owns it afterwards.
      try { const theme = localStorage.getItem('before-i-call-theme'); if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme; } catch { /* Storage can be unavailable. */ }
    </script>
