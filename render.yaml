services:
  - type: web
    name: before-i-call
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: usage-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ANALYTICS_DB_PATH
        value: /var/data/analytics.sqlite3
      - key: ANALYTICS_ADMIN_KEY
        generateValue: true
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_AGENT_ID
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: LIVE_ACCESS_CODE
        sync: false
      - key: MAX_CONCURRENT_CALLS
        value: '2'
      - key: MAX_CALL_SECONDS
        value: '120'
      - key: MAX_CALLS_PER_VISITOR_DAY
        value: '3'
      - key: MAX_DAILY_CALL_SECONDS
        value: '1800'
      - key: MAX_HELP_REQUESTS_PER_CALL
        value: '6'
      - key: MAX_SPEECH_REQUESTS_PER_CALL
        value: '6'
